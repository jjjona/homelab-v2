---
# ============================================================================
# 14-todo.yml — Deploy the canonical Forgejo todo app on Laptop 1.
#
# A minimal self-hosted Todoist-style app (Bun + SQLite, single container)
# whose point is completion-anchored recurrence ("X after done"), plus a
# self-hosted ntfy sidecar for iPhone push reminders.
#
# Architecture:
#   - Repo is PRIVATE GitHub jjjona/todo, cloned to /opt/todo and bind-mounted
#     at /app. Codex and Git run inside the app container as uid 1000; Codex
#     login and writable Git credentials persist in Compose-managed volumes.
#   - Data (SQLite + ntfy auth/cache) lives in /opt/todo-data, bind-mounted;
#     backed up nightly by restic (11-laptops.yml laptop_backup.paths).
#   - Routing: compose labels -> traefik-kop (already on laptop1) -> Redis ->
#     Traefik.  todo.<domain> on `web` (tinyauth forwardAuth, like writing);
#     ntfy.<domain> on `web-noauth` — the ntfy iOS app can't do SSO, ntfy's own
#     auth is the gate (auth-default-access=deny-all + user/password).
#     ntfy.<domain> also needs a cloudflared ingress rule -> traefik:81
#     (03-core-services.yml).
#   - iOS instant delivery: NTFY_UPSTREAM_BASE_URL=https://ntfy.sh relays only
#     a wake-up ping through ntfy.sh; message content stays on this server.
#
# Secrets: secrets/todo.sops.yml (deploy key, ntfy user/password/topic),
#          secrets/hive.sops.yml (domain).
# Run from ansible/:  ansible-playbook playbooks/14-todo.yml
# ============================================================================

# =============================================================
# Play A: Laptop 1 (.165) — deploy the todo + ntfy stack
# =============================================================
- name: Deploy todo on Laptop 1
  hosts: laptop1
  gather_facts: false
  tags: [todo, deploy]

  vars:
    todo_secrets: "{{ lookup('community.sops.sops', playbook_dir + '/../secrets/todo.sops.yml') | from_yaml }}"
    hive_secrets: "{{ lookup('community.sops.sops', playbook_dir + '/../secrets/hive.sops.yml') | from_yaml }}"
    domain: "{{ hive_secrets.domain }}"
    todo_dir: /opt/todo            # git clone == build context and /app bind mount
    todo_data_dir: /opt/todo-data  # SQLite + ntfy state; in restic backup paths
    todo_deploy_ssh: /opt/todo-deploy-ssh
    todo_host_user: hive           # uid 1000, matching the container's bun user
    todo_repo_url: "ssh://git@192.168.0.159:2222/jjjona/todo.git"
    todo_web_port: 4712            # host port; container listens on 3000
    ntfy_web_port: 4713            # host port; container listens on 80

  tasks:
    - name: Ensure git is installed on laptop1 (Alpine)
      ansible.builtin.command: apk add --no-cache git
      args:
        creates: /usr/bin/git

    # Run deployment Git as the same uid that owns and edits the bind-mounted
    # checkout. Trusting a uid-1000-owned repository in root's safe.directory
    # would let mutable Git config influence commands Ansible runs as root.
    - name: Create host Todo deployment SSH directory
      ansible.builtin.file:
        path: "{{ todo_deploy_ssh }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0700"
      tags: [checkout]

    - name: Install Todo deployment Git key
      ansible.builtin.copy:
        dest: "{{ todo_deploy_ssh }}/id_ed25519"
        # | trim + explicit \n: OpenSSH keys need exactly one trailing newline.
        content: "{{ todo_secrets.todo_deploy_key | trim }}\n"
        owner: "1000"
        group: "1000"
        mode: "0600"
      no_log: true
      tags: [checkout]

    - name: Pin Forgejo SSH host keys for deployment Git
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/forgejo_known_hosts"
        dest: "{{ todo_deploy_ssh }}/known_hosts"
        owner: "1000"
        group: "1000"
        mode: "0644"
      tags: [checkout]

    - name: Make the checkout editable by the container user
      ansible.builtin.file:
        path: "{{ todo_dir }}"
        state: directory
        recurse: true
        owner: "1000"
        group: "1000"
      tags: [checkout]

    - name: Read root Git safe directories
      ansible.builtin.command:
        argv: [git, config, --global, --get-all, safe.directory]
      register: root_git_safe_directories
      changed_when: false
      failed_when: root_git_safe_directories.rc not in [0, 1]
      check_mode: false
      tags: [checkout]

    - name: Remove obsolete root trust for the Todo checkout
      ansible.builtin.command:
        argv: [git, config, --global, --fixed-value, --unset-all, safe.directory, "{{ todo_dir }}"]
      when: todo_dir in root_git_safe_directories.stdout_lines
      tags: [checkout]

    - name: Remove obsolete root Todo deployment key
      ansible.builtin.file:
        path: /root/.ssh/todo_github_ed25519
        state: absent
      tags: [checkout]

    - name: Clone/update Todo repo as its owner
      ansible.builtin.git:
        repo: "{{ todo_repo_url }}"
        dest: "{{ todo_dir }}"
        version: main
        update: true
        accept_hostkey: true
        key_file: "{{ todo_deploy_ssh }}/id_ed25519"
        ssh_opts: "-o UserKnownHostsFile={{ todo_deploy_ssh }}/known_hosts -o StrictHostKeyChecking=yes"
      become: true
      become_user: "{{ todo_host_user }}"
      register: todo_git
      tags: [checkout]

    - name: Set Git identity for Codex commits
      ansible.builtin.command:
        argv: [git, -C, "{{ todo_dir }}", config, "{{ item.k }}", "{{ item.v }}"]
      become: true
      become_user: "{{ todo_host_user }}"
      loop:
        - { k: user.name, v: "todo-codex" }
        - { k: user.email, v: "todo-codex@{{ domain }}" }
      changed_when: false
      tags: [checkout]

    # --- Data dirs (bind mounts) ---
    - name: Create todo data dir (SQLite; container runs as uid 1000 "bun")
      ansible.builtin.file:
        path: "{{ todo_data_dir }}/todo"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0750"

    - name: Create ntfy data dir (ntfy runs as root in its container)
      ansible.builtin.file:
        path: "{{ todo_data_dir }}/ntfy"
        state: directory
        owner: root
        group: root
        mode: "0750"

    # --- Per-system config (gitignored in the repo) ---
    - name: Write todo .env
      ansible.builtin.copy:
        dest: "{{ todo_dir }}/.env"
        content: |
          # Managed by ansible (14-todo.yml). Per-system config.
          TODO_HOST=todo.{{ domain }}
          NTFY_HOST=ntfy.{{ domain }}
          TODO_WEB_PORT={{ todo_web_port }}
          NTFY_WEB_PORT={{ ntfy_web_port }}
          TODO_DATA_DIR={{ todo_data_dir }}
          NTFY_TOPIC={{ todo_secrets.ntfy_topic }}
          NTFY_USER={{ todo_secrets.ntfy_user }}
          NTFY_PASSWORD={{ todo_secrets.ntfy_password }}
          TZ=Europe/Brussels
        owner: "1000"
        group: "1000"
        mode: "0600"
      no_log: true

    # Current Todo Compose owns todo-codex and todo-ssh named volumes. Remove
    # the old deployment override so recovery installs match the app repo and
    # Docker preserves both volumes across container recreation.
    - name: Remove obsolete Todo Compose override
      ansible.builtin.file:
        path: "{{ todo_dir }}/docker-compose.override.yml"
        state: absent

    # --- Deploy ---
    - name: Build and start todo + ntfy
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ todo_dir }}"
      changed_when: true

    - name: Wait for the todo web UI on :{{ todo_web_port }}
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ todo_web_port }}"
        timeout: 180

    - name: Wait for ntfy on :{{ ntfy_web_port }}
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ ntfy_web_port }}"
        timeout: 60

    # The app's todo-ssh named volume starts empty after a recovery. Discover
    # its Docker-managed mountpoint and seed the same writable deploy key used
    # by the live container so in-container Git and Codex can pull and push.
    - name: Find the Todo SSH volume mountpoint
      ansible.builtin.command:
        argv: [docker, volume, inspect, --format, "{{ '{{ .Mountpoint }}' }}", todo_todo-ssh]
      register: todo_ssh_volume
      changed_when: false
      check_mode: false
      tags: [git_credentials]

    - name: Secure the Todo SSH volume
      ansible.builtin.file:
        path: "{{ todo_ssh_volume.stdout }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0700"
      tags: [git_credentials]

    - name: Install Todo Git key in its persistent volume
      ansible.builtin.copy:
        dest: "{{ todo_ssh_volume.stdout }}/id_ed25519"
        content: "{{ todo_secrets.todo_deploy_key | trim }}\n"
        owner: "1000"
        group: "1000"
        mode: "0600"
      no_log: true
      tags: [git_credentials]

    - name: Pin Forgejo SSH host keys in the persistent volume
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/forgejo_known_hosts"
        dest: "{{ todo_ssh_volume.stdout }}/known_hosts"
        owner: "1000"
        group: "1000"
        mode: "0644"
      tags: [git_credentials]

    - name: Configure Forgejo SSH in the persistent volume
      ansible.builtin.copy:
        dest: "{{ todo_ssh_volume.stdout }}/config"
        owner: "1000"
        group: "1000"
        mode: "0600"
        content: |
          Host 192.168.0.159
              HostName 192.168.0.159
              Port 2222
              User git
              IdentityFile /home/bun/.ssh/id_ed25519
              IdentitiesOnly yes
              UserKnownHostsFile /home/bun/.ssh/known_hosts
              StrictHostKeyChecking yes
      tags: [git_credentials]

    # --- ntfy auth: converge the publisher/subscriber user + topic ACL ---
    # auth-default-access=deny-all, so this user is the only way in. The todo
    # server publishes with it; the iPhone ntfy app subscribes with it.
    - name: Ensure ntfy user exists (create or converge password)
      ansible.builtin.shell: |
        set -e
        if docker exec ntfy ntfy user list 2>&1 | grep -Fq "user $NTFY_USER "; then
          docker exec -e NTFY_PASSWORD ntfy ntfy user change-pass "$NTFY_USER"
        else
          docker exec -e NTFY_PASSWORD ntfy ntfy user add "$NTFY_USER"
        fi
      environment:
        NTFY_USER: "{{ todo_secrets.ntfy_user }}"
        NTFY_PASSWORD: "{{ todo_secrets.ntfy_password }}"
      no_log: true
      changed_when: true

    - name: Grant the user read-write on the topic
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - ntfy
          - ntfy
          - access
          - "{{ todo_secrets.ntfy_user }}"
          - "{{ todo_secrets.ntfy_topic }}"
          - rw
      no_log: true
      changed_when: true

    # --- Update helper ---
    - name: Install todo-update helper (pull + restart)
      ansible.builtin.copy:
        dest: /usr/local/bin/todo-update
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          # Managed by ansible (14-todo.yml). Pull latest todo code and redeploy.
          set -eu
          docker exec -u bun -w /app todo git pull --ff-only
          docker restart todo >/dev/null
          echo "todo-update: pulled + restarted (container NOT recreated)."
          echo "  Dockerfile changed? run: todo-rebuild"
      tags: [helpers]

    - name: Install todo-rebuild helper (pull + clean rebuild)
      ansible.builtin.copy:
        dest: /usr/local/bin/todo-rebuild
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          set -eu
          docker exec -u bun -w /app todo git pull --ff-only
          cd /opt/todo
          docker compose build --no-cache
          docker compose up -d --force-recreate
      tags: [helpers]

    - name: Install todo container shell/exec helper
      ansible.builtin.copy:
        dest: /usr/local/bin/todo
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          set -eu
          if [ "$#" -eq 0 ]; then
            exec docker exec -it -u bun -w /app todo sh
          fi
          exec docker exec -it -u bun -w /app todo "$@"
      tags: [helpers]

    - name: Show todo command reminder on interactive server login
      ansible.builtin.copy:
        dest: /etc/profile.d/todo-commands.sh
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by ansible (14-todo.yml). Interactive logins only.
          case "$-" in
            *i*)
              printf '\n\033[1;36mTodo commands:\033[0m\n'
              printf '  \033[1;32mtodo\033[0m          enter the app container at /app\n'
              printf '  \033[1;32mtodo-update\033[0m   pull + restart (no recreate)\n'
              printf '  \033[1;32mtodo-rebuild\033[0m  pull + clean rebuild + recreate\n\n'
              ;;
          esac
      tags: [helpers]

# =============================================================
# Play B: docker-host (.159) — refresh Traefik for the new kop routes
# =============================================================
# Documented gotcha: Traefik does not re-read traefik-kop/Redis keys republished
# after its own startup. New containers publishing kop keys need a Traefik
# bounce to appear. Brief (seconds) downtime on existing routes.
- name: Refresh Traefik so it picks up the todo + ntfy routes
  hosts: docker_host
  gather_facts: false
  tags: [todo, traefik]

  tasks:
    - name: Restart traefik
      ansible.builtin.command: docker restart traefik
      changed_when: true
